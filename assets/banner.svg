<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f2027"/>
      <stop offset="50%" stop-color="#203a43"/>
      <stop offset="100%" stop-color="#2c5364"/>
      <animate attributeName="x1" values="0%;100%;0%" dur="12s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="title" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00e5ff"/>
      <stop offset="50%" stop-color="#7c6cff"/>
      <stop offset="100%" stop-color="#00e5ff"/>
      <animate attributeName="x1" values="0%;100%;0%" dur="8s" repeatCount="indefinite"/>
    </linearGradient>
    <pattern id="dots" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="2" fill="#ffffff"/>
    </pattern>
  </defs>
  <rect width="1200" height="320" fill="url(#bg)"/>
  <rect width="1200" height="320" fill="url(#dots)" opacity="0.12"/>
  <circle cx="1000" cy="70" r="46" fill="#00e5ff" opacity="0.25">
    <animate attributeName="cy" values="70;100;70" dur="6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="150" cy="250" r="30" fill="#7c6cff" opacity="0.3">
    <animate attributeName="cy" values="250;220;250" dur="7s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1080" cy="260" r="22" fill="#00e5ff" opacity="0.3">
    <animate attributeName="cx" values="1080;1040;1080" dur="9s" repeatCount="indefinite"/>
  </circle>
  <text x="600" y="148" text-anchor="middle" font-family="'Fira Code', monospace" font-size="64" font-weight="bold" fill="url(#title)" letter-spacing="4">MASHHOOD ALI</text>
  <text x="600" y="198" text-anchor="middle" font-family="'Fira Code', monospace" font-size="24" fill="#e6f4ff" letter-spacing="3">SOFTWARE ENGINEER — INDUSTRIAL SYSTEMS</text>
  <text x="600" y="240" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#9fd8ef">C++ • Python • JavaScript • QA • Telemetry • Secure Systems</text>
</svg>
